name: Canadian Stock Screener

on:
  schedule:
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas ta requests python-dotenv beautifulsoup4 lxml

      - name: Restore snapshot database
        uses: actions/cache@v4
        with:
          path: data/snapshots.db
          key: snapshots-db-${{ github.run_id }}
          restore-keys: snapshots-db-

      - name: Create .env file
        run: |
          echo "GMAIL_ADDRESS=${{ secrets.GMAIL_ADDRESS }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env

      - name: Run screener
        run: python main.py --no-sentiment --send

      - name: Publish dashboard data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/canada.json || true
          git diff --cached --quiet || git commit -m "chore: update dashboard data [skip ci]"
          git push
