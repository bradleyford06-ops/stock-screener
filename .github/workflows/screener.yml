name: Canadian Stock Screener

on:
  schedule:
    # 8AM ET = 1PM UTC (Mon, Wed, Fri)
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:  # allows manual trigger from GitHub

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install yfinance pandas ta transformers torch requests python-dotenv schedule beautifulsoup4 lxml

      - name: Create .env file from secrets
        run: |
          echo "GMAIL_ADDRESS=${{ secrets.GMAIL_ADDRESS }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env

      - name: Run screener and send email
        run: python main.py --no-sentiment --send

      - name: Upload last report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-report
          path: .claude/memory/last_report.json
          retention-days: 7
