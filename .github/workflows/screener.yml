name: Canadian Stock Screener

on:
  schedule:
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas ta transformers torch requests python-dotenv schedule beautifulsoup4 lxml

      - name: Create .env file
        run: |
          echo "GMAIL_ADDRESS=${{ secrets.GMAIL_ADDRESS }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env

      - name: Run screener
        run: python main.py --no-sentiment --send
